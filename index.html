<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nanohaのコンクール手帳</title>
<meta name="description" content="関東と、山梨・長野・静岡のバレエコンクールを集めたNanoha専用の手帳">
<meta name="theme-color" content="#F7EEF5">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nanoha手帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Great+Vibes&family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-top">
      <img class="hero-photo" src="img/nanoha-photo.jpg" alt="Nanohaの舞台写真" width="200" height="200">
      <div class="hero-brand">
        <p class="logo">Nanoha ♡ Ballet</p>
        <p class="logo-sub">Ballet Competition Notebook — Classical &amp; Contemporary</p>
      </div>
    </div>
    <h1 class="hero-title"><span class="h">♡</span> Nanohaのコンクール手帳 <span class="h">♡</span></h1>
    <p class="hero-desc" id="heroDesc">関東と、山梨・長野・静岡のコンクールを集めたNanoha専用の手帳です。</p>
    <section class="notice" id="notice" aria-label="締切のお知らせ" hidden></section>
    <img class="hero-tutu" src="img/tutu.png" alt="" aria-hidden="true">
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" role="tab" data-view="list" aria-selected="true">♡ コンクール一覧</button>
    <button class="tab" role="tab" data-view="guide" aria-selected="false">♡ ガイド・参考</button>
  </nav>

  <main>
    <div id="view-list" class="view">
      <div id="selections"></div>
      <img class="list-divider" src="img/tiara.png" alt="" aria-hidden="true">

      <section class="filters" id="filters">
        <div class="chips month-chips" id="monthChips"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="search" type="search" placeholder="コンクール名・会場で検索（例：YBC）" autocomplete="off" enterkeyhint="search">
        </label>
        <p class="count" id="count"></p>
        <div class="chips filter-chips" id="filterChips"></div>
      </section>

      <div id="list"></div>
    </div>

    <div id="view-guide" class="view" hidden></div>
  </main>

  <p class="loading" id="loading">読み込み中…</p>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
